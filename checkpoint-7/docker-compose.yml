services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: music-reco-backend
    ports:
      - "8000:8000"
    volumes:
      - ./music:/app/music:ro
      - ./metadata:/app/metadata:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: music-reco-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      BACKEND_PUBLIC_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
